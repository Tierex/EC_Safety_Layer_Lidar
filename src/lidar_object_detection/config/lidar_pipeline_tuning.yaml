# lidar_pipeline_tuning.yaml
# Configuration for the current lidar_object_detection C++ nodes.
# This file only contains parameters that are declared in the current .cpp scripts.
# Node names must match the names used in the launch files.

lidar_detector:
  ros__parameters:
    # Topics
    input_topic: /velodyne_points
    output_topic: /detected_objects
    marker_topic: /detected_object_markers

    # QoS / processing
    qos_depth: 10
    reliable_qos: false
    process_every_n_frames: 1

    # Region of interest in the LiDAR frame [m]
    roi_x_min: -4.0
    roi_x_max: 4.0
    roi_y_min: -3.0
    roi_y_max: 3.0
    roi_z_min: -3.0
    roi_z_max: 3.0

    # Downsampling
    voxel_size: 0.05

    # Ground removal
    use_ground_removal: true
    ground_max_distance: 0.10
    ground_max_angle_deg: 15.0
    ground_max_iterations: 50

    # Euclidean clustering
    cluster_tolerance: 0.25
    min_cluster_size: 8
    max_cluster_size: 2000

    # Bounding-box size filter [m]
    min_x_size: 0.15
    min_y_size: 0.15
    min_z_size: 0.30
    max_x_size: 0.80
    max_y_size: 0.80
    max_z_size: 2.00

    # Debug / RViz markers
    debug: false
    debug_every_n_frames: 10
    debug_objects: true
    publish_markers: true
    marker_lifetime: 0.25

object_tracker:
  ros__parameters:
    # Topics
    input_topic: /detected_objects
    output_topic: /tracked_objects
    marker_topic: /tracked_object_markers
    frame_id: velodyne

    # QoS
    qos_depth: 20

    # Detection-to-track association
    max_match_distance: 1.0
    max_z_match_distance: 1.0
    max_size_change_ratio: 2.5

    # Track management
    max_missed_frames: 5
    min_hits_to_publish: 1
    predict_missed_tracks: true

    # Velocity estimation
    velocity_alpha: 0.35
    max_velocity: 15.0
    max_dt: 0.5
    min_dt: 0.001

    # Debug / RViz markers
    publish_markers: true
    marker_lifetime: 0.25
    debug: false
    debug_every_n_frames: 30

safety_supervisor:
  ros__parameters:
    # Topics
    input_topic: /tracked_objects
    output_topic: /safety_signal
    ego_speed_topic: /ego_speed
    marker_topic: /safety_zones_array

    # QoS / timing
    qos_depth: 20
    publish_rate_hz: 20.0

    # Fail-safe behaviour
    stale_timeout_sec: 0.5
    stale_signal: 0
    ego_speed_stale_timeout_sec: 1.0

    # Sensor offset relative to the vehicle safety frame [m]
    # safety_base: x=0 at the front bumper, y=0 centreline, z=0 ground level.
    sensor_offset_x: -0.57
    sensor_offset_y: 0.0
    sensor_offset_z: 1.8

    # Front safety zones [m]
    emergency_distance: 1.5
    hazard_distance: 2.5

    # Side hazard zones [m]
    enable_side_zones: true
    side_zone_length: 6.0
    side_zone_width: 0.6
    side_zone_offset_y: 0.5

    # Track filtering before safety evaluation
    min_track_hits: 1
    max_track_misses: 2

    # Hold times to reduce rapid switching [s]
    emergency_hold_sec: 0.30
    hazard_hold_sec: 0.50

    # VLP-16 visibility model
    zone_height: 3.0
    lidar_down_angle_deg: 15.0
    lidar_up_angle_deg: 15.0

    # RViz markers
    marker_frame_id: safety_base
    sector_azimuth_steps: 120

    # Debug
    debug: true
    debug_every_n_frames: 1

ego_speed_constant_node:
  ros__parameters:
    ego_speed_topic: /ego_speed
    speed_mps: 1.3889
    publish_rate_hz: 50.0

ego_speed_from_odom_node:
  ros__parameters:
    odom_topic: /odom
    ego_speed_topic: /ego_speed
    use_speed_magnitude: false
    smoothing_alpha: 0.35
    max_speed_mps: 5.0

ego_yaw_from_imu_node:
  ros__parameters:
    imu_topic: /imu/data
    ego_yaw_rate_topic: /ego_yaw_rate
    smoothing_alpha: 0.35
    max_yaw_rate_rps: 10.0

control_node:
  ros__parameters:
    input_topic: /safety_signal
    output_topic: /cmd_vel
    speed_free_mps: 1.3889
    speed_hazard_mps: 0.50
    speed_emergency_mps: 0.0
    max_accel_step_mps: 0.20

safety_monitor_node:
  ros__parameters:
    tracked_objects_topic: /tracked_objects
    safety_signal_topic: /safety_signal
    ego_speed_topic: /ego_speed
    print_rate_hz: 2.0

safety_performance_monitor:
  ros__parameters:
    pointcloud_topic: /velodyne_points
    tracked_objects_topic: /tracked_objects
    safety_signal_topic: /safety_signal
    raw_cmd_topic: /cmd_vel_raw
    final_cmd_topic: /cmd_vel
    summary_topic: /safety_monitor_summary
    summary_period_sec: 1.0
    stop_speed_threshold_mps: 0.03
    override_speed_epsilon_mps: 0.05
    output_dir: /home/school/performance_results
    bag_missing_cycles_before_stop: 3
    enable_sim_time: false
    debug: true
    use_sim_time: false


safety_supervisor:
  ros__parameters:

    # =========================================================
    # Topics
    # =================================================: 0    # =========================================================
    ego_speed_stale_timeout_sec: 1.0

    # =========================================================
    # Sensor offset (LiDAR → voertuig)
    # x = LiDAR positie t.o.v. front bumper in voertuigframe
    # z = midden LiDAR t.o.v. grond
    # =========================================================
    sensor_offset_x: -0.57
    sensor_offset_y: 0.0
    sensor_offset_z: 1.8

    # =========================================================
    # FRONT SAFETY (GEEN overlap)
    # =========================================================
    corridor_half_width: 1.0
    min_x_consider: 0.0
    max_x_consider: 20.0

    # Emergency: 0 → 1.5 m vanaf voorkant truck
    # Hazard:    1.5 → 2.5 m vanaf voorkant truck
    emergency_distance: 1.5
    hazard_distance: 2.5

    # =========================================================
    # VLP-16 zichtfrustum voor RViz
    # VLP-16 vertical FOV = +15° / -15°
    # =========================================================
    lidar_down_angle_deg: 15.0
    lidar_up_angle_deg: 15.0

    # =========================================================
    # SIDE ZONES (GEEN overlap, langs trailer)
    # =========================================================
    enable_side_zones: true

    side_zone_length: 6.0
    side_zone_width: 0.6
    side_zone_offset_y: 1.2
    min_side_approach_speed: 0.10

    # =========================================================
    # TTC (Time-To-Collision)
    # =========================================================
    enable_ttc: true
    emergency_ttc: 0.6
    hazard_ttc: 1.5
    min_closing_speed: 0.10

    # =========================================================
    # Track filtering
    # =========================================================
    min_track_hits: 1
    max_track_misses: 2

    # =========================================================
    # Cut-in prediction
    # =========================================================
    enable_cut_in_prediction: true
    hazard_prediction_horizon: 1.5
    emergency_prediction_horizon: 0.5
    min_lateral_speed: 0.10

    # =========================================================
    # HOLD TIMES (stabiliteit)
    # =========================================================
    emergency_hold_sec: 0.30
    hazard_hold_sec: 0.50

    # =========================================================
    # HYSTERESIS (tegen flippen)
    # =========================================================
    emergency_distance_hysteresis: 0.30
    hazard_distance_hysteresis: 0.30

    emergency_ttc_hysteresis: 0.20
    hazard_ttc_hysteresis: 0.20

    side_zone_hysteresis_x: 0.20
    side_zone_hysteresis_y: 0.10

    # =========================================================
    # Physics brake model
    # =========================================================
    enable_brake_model: true
    ego_speed_mps: 1.3889
    max_decel_mps2: 1.5
    system_delay_sec: 0.30

    emergency_margin_m: 0.10
    hazard_margin_m: 0.25

    # =========================================================
    # RVIZ VISUALISATIE
    # =========================================================
    marker_topic: /safety_zones_array
    marker_frame_id: velodyne

    # Visuele hoogtecap voor frustum en side boxes.
    # 3.0 laat de +15° bovenstraal beter zien dan 2.0.
    zone_height: 3.0

    lidar_down_angle_deg: 15.0
    lidar_up_angle_deg: 15.0


    # =========================================================
    # Debug
    # =========================================================
    debug: true
    debug_every_n_frames: 1
    debug_timer: true
    input_topic: /tracked_objects
    output_topic: /safety_signal
    ego_speed_topic: /ego_speed

    # =========================================================
    # QoS / timing
    # =========================================================
    qos_depth: 20
    publish_rate_hz: 20.0

    # =========================================================
    # Fail-safe gedrag
    # =========================================================
    stale_timeout_sec: 0.5